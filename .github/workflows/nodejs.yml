name: Node.js CI

"on":
  - push
  - pull_request

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install corepack
        run: npm install -g corepack@0.35.0
      - name: enable corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: yarn --immutable
      - name: Formatter
        run: yarn format:ci
      - name: Lint
        run: yarn lint
      - name: Build Packages
        run: BASE_PATH=/react-icons ./build-script.sh
      - uses: actions/upload-artifact@v7
        with:
          path: |
            packages/_react-icons_*/*.tgz
            generated-packages/*/*.tgz
            generated-packages-files/*/*.tgz
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./packages/preview-astro/dist
        if: github.ref == 'refs/heads/master'
      - name: Generate release notes
        run: |
          gh api /repos/react-icons/react-icons/releases/generate-notes -f tag_name=${GITHUB_REF#refs/tags/} --jq .body >> RELEASE_NOTES
          echo >> RELEASE_NOTES
          cat packages/react-icons/VERSIONS >> RELEASE_NOTES
          cat RELEASE_NOTES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: Determine release channel
        id: release_channel
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm-tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi
        if: startsWith(github.ref, 'refs/tags/')
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "packages/_react-icons_*/*.tgz,generated-packages/*/*.tgz,generated-packages-files/*/*.tgz"
          bodyFile: "RELEASE_NOTES"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.release_channel.outputs.prerelease == 'true' }}
          allowUpdates: true
        if: startsWith(github.ref, 'refs/tags/')
      - name: npm publish core package
        run: npm publish generated-packages/core/*.tgz --access public --provenance --tag "${{ steps.release_channel.outputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: npm publish icon packages
        run: |
          for package_tgz in generated-packages/*/*.tgz; do
            if [[ "$package_tgz" == generated-packages/core/* ]]; then
              continue
            fi
            npm publish "$package_tgz" --access public --provenance --tag "${{ steps.release_channel.outputs.npm-tag }}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: npm publish icon files packages
        run: |
          for package_tgz in generated-packages-files/*/*.tgz; do
            npm publish "$package_tgz" --access public --provenance --tag "${{ steps.release_channel.outputs.npm-tag }}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: npm publish react-icons
        run: npm publish packages/_react-icons_all/*.tgz --access public --provenance --tag "${{ steps.release_channel.outputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')

  deploy-pages:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
