name: Node.js CI

"on":
  - push
  - pull_request

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install corepack
        run: npm install -g corepack@0.35.0
      - name: enable corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0
      - name: Check npm authentication for new packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : > .npm-new-packages

          for package_json in \
            generated-packages/*/package.json \
            generated-packages-files/*/package.json \
            packages/_react-icons_all/package.json; do
            package_name=$(node -e 'console.log(require(`./${process.argv[1]}`).name)' "$package_json")
            encoded_name=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$package_name")
            status=$(curl --silent --show-error --location --retry 3 --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$encoded_name")

            case "$status" in
              200) ;;
              404) echo "$package_name" >> .npm-new-packages ;;
              *)
                echo "::error title=npm registry lookup failed::$package_name returned HTTP $status"
                exit 1
                ;;
            esac
          done

          if [[ -s .npm-new-packages ]]; then
            echo "New npm packages requiring NPM_TOKEN:"
            cat .npm-new-packages

            if [[ -z "$NPM_TOKEN" ]]; then
              echo "::error title=NPM_TOKEN required::A new package must be published with a granular access token. Add or renew the NPM_TOKEN repository secret."
              exit 1
            fi

            if ! NODE_AUTH_TOKEN="$NPM_TOKEN" npm whoami --registry https://registry.npmjs.org/; then
              echo "::error title=Invalid NPM_TOKEN::NPM_TOKEN is invalid or expired. Renew the token before publishing new packages."
              exit 1
            fi
          fi
      - name: Install dependencies
        run: yarn --immutable
      - name: Formatter
        run: yarn format:ci
      - name: Lint
        run: yarn lint
      - name: Build Packages
        run: BASE_PATH=/react-icons ./build-script.sh
      - uses: actions/upload-artifact@v7
        with:
          path: |
            packages/_react-icons_*/*.tgz
            generated-packages/*/*.tgz
            generated-packages-files/*/*.tgz
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./packages/preview-astro/dist
        if: github.ref == 'refs/heads/master'
      - name: Generate release notes
        run: |
          gh api /repos/react-icons/react-icons/releases/generate-notes -f tag_name=${GITHUB_REF#refs/tags/} --jq .body >> RELEASE_NOTES
          echo >> RELEASE_NOTES
          cat packages/react-icons/VERSIONS >> RELEASE_NOTES
          cat RELEASE_NOTES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
      - name: Determine release channel
        id: release_channel
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm-tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi
        if: startsWith(github.ref, 'refs/tags/')
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "packages/_react-icons_*/*.tgz,generated-packages/*/*.tgz,generated-packages-files/*/*.tgz"
          bodyFile: "RELEASE_NOTES"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.release_channel.outputs.prerelease == 'true' }}
          allowUpdates: true
        if: startsWith(github.ref, 'refs/tags/')
      - name: Publish npm packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.release_channel.outputs.npm-tag }}
        run: |
          publish_package() {
            package_dir=$1
            package_json="$package_dir/package.json"
            package_name=$(node -e 'console.log(require(`./${process.argv[1]}`).name)' "$package_json")
            package_version=$(node -e 'console.log(require(`./${process.argv[1]}`).version)' "$package_json")
            encoded_name=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$package_name")
            encoded_version=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$package_version")
            status=$(curl --silent --show-error --location --retry 3 --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$encoded_name/$encoded_version")

            case "$status" in
              200)
                echo "Skipping $package_name@$package_version: already published"
                return
                ;;
              404) ;;
              *)
                echo "::error title=npm registry lookup failed::$package_name@$package_version returned HTTP $status"
                exit 1
                ;;
            esac

            package_tgz=$(find "$package_dir" -maxdepth 1 -name '*.tgz' -print -quit)
            if [[ -z "$package_tgz" ]]; then
              echo "::error title=Package artifact missing::No tarball found for $package_name@$package_version"
              exit 1
            fi

            if grep --fixed-strings --line-regexp --quiet "$package_name" .npm-new-packages; then
              echo "Publishing new package $package_name@$package_version with NPM_TOKEN"
              NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "$package_tgz" --access public --provenance --tag "$NPM_DIST_TAG"
            else
              echo "Staging existing package $package_name@$package_version with OIDC"
              env --unset=NODE_AUTH_TOKEN npm stage publish "$package_tgz" --access public --provenance --tag "$NPM_DIST_TAG"
            fi
          }

          publish_package generated-packages/core

          for package_json in generated-packages/*/package.json; do
            package_dir=${package_json%/package.json}
            if [[ "$package_dir" != generated-packages/core ]]; then
              publish_package "$package_dir"
            fi
          done

          for package_json in generated-packages-files/*/package.json; do
            publish_package "${package_json%/package.json}"
          done

          publish_package packages/_react-icons_all

  deploy-pages:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
